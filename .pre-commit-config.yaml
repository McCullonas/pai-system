repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        exclude: >-
          (?x)^(
            MEMORY/WORK/.*|
            skills/PAI/USER/MEMORY-ARCHIVE/.*|
            skills/Fabric/Patterns/.*|
            skills/PAI/Components/Algorithm/v0\..*
          )$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        exclude: >-
          (?x)^(
            MEMORY/WORK/.*|
            skills/PAI/USER/MEMORY-ARCHIVE/.*
          )$
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["--config", ".codespellrc"]
        exclude: >-
          (?x)^(
            MEMORY/WORK/.*|
            skills/PAI/USER/MEMORY-ARCHIVE/.*|
            skills/Fabric/Patterns/.*|
            skills/PAI/Components/Algorithm/v0\..*|
            skills/PAI/Tools/.*\.ts
          )$
