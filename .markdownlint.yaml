# Markdownlint configuration
MD013: false  # Line length - too restrictive for documentation
MD022: false  # Headers should be surrounded by blank lines
MD031: false  # Fenced code blocks should be surrounded by blank lines
MD032: false  # Lists should be surrounded by blank lines
MD033: false  # Inline HTML - needed for flexibility
MD034: false  # Bare URL used - we use bare URLs intentionally
MD036: false  # Emphasis used instead of a heading
MD040: false  # Fenced code blocks should have a language specified
MD009: false  # Trailing spaces
MD012: false  # Multiple consecutive blank lines - common in structured docs
MD024: false  # Multiple headings with the same content - natural in structured docs
MD025: false  # Multiple top-level headings - skills use multiple H1s as section separators
MD029: false  # Ordered list item prefix - we use actual numbers not all-1s
MD037: false  # Spaces inside emphasis markers
MD004: false  # Unordered list style - mixed styles across upstream skills
MD007: false  # Unordered list indentation - upstream skills use varied indentation
MD010: false  # Hard tabs - present in some upstream content
MD026: false  # Trailing punctuation in heading - common pattern in skill docs
MD028: false  # Blank line inside blockquote
MD041: false  # First line should be heading - many files start with frontmatter or instructions
MD047: false  # Files should end with single newline
MD001: false  # Heading increment - skills use flexible heading levels
MD003: false  # Heading style - mixed atx/setext across codebase
MD018: false  # No space after hash - shebangs trigger false positives
MD023: false  # Headings must start at beginning of line - comment blocks
MD046: false  # Code block style - mixed fenced/indented
MD055: false  # Table pipe style - varied across docs
MD056: false  # Table column count
